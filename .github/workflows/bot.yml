name: RollerCoin Bot

on:
  workflow_dispatch:
    inputs:
      games:
        description: "اسم بازی‌ها با کاما (2048 Coins, Coin-Flip, Coin-match, Cryptonoid)"
        default: "2048 Coins,Coin-Flip,Coin-match,Cryptonoid"
      rounds:
        description: "چند بار هر بازی اجرا شود"
        default: "3"
  schedule:
    - cron: '17 */2 * * *'       # هر ۲ ساعت (دقیقه‌ی ۱۷ تا با شلوغی اول ساعت برخورد نکند)

concurrency:
  group: rollercoin-session
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore session state
        uses: actions/cache/restore@v4
        with:
          path: session_state
          key: rc-session-${{ github.run_id }}
          restore-keys: rc-session-

      - name: Run RollerCoin Bot
        run: python main.py
        env:
          RC_SESSION: ${{ secrets.RC_SESSION }}
          RC_LOCAL: ${{ secrets.RC_LOCAL }}
          GAMES: ${{ github.event.inputs.games || '2048 Coins,Coin-Flip,Coin-match,Cryptonoid' }}
          ROUNDS: ${{ github.event.inputs.rounds || '3' }}
          HEADLESS: "1"
          JITTER: ${{ github.event_name == 'schedule' && '1' || '0' }}

      - name: Save session state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session_state
          key: rc-session-${{ github.run_id }}

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
