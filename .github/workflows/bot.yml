name: RollerCoin Bot

on:
  schedule:
    - cron: '0 * * * *'   # هر ساعت
  workflow_dispatch:       # اجرای دستی

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RollerCoin Bot
        run: python main.py
        env:
          RC_EMAIL: ${{ secrets.RC_EMAIL }}
          RC_PASSWORD: ${{ secrets.RC_PASSWORD }}
          RC_SESSION: ${{ secrets.RC_SESSION }}
          RC_LOCAL: ${{ secrets.RC_LOCAL }}
          HEADLESS: "1"

      # اسکرین‌شات و HTML صفحه برای دیباگ (حتی اگر خطا بدهد)
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
