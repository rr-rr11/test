name: RollerCoin Probe

on:
  workflow_dispatch:
    inputs:
      game:
        description: "اسم بازی (مثل: 2048 Coins یا Coin-Flip)"
        default: "2048 Coins"

concurrency:
  group: rollercoin-session
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Restore session state
        uses: actions/cache/restore@v4
        with:
          path: session_state
          key: rc-session-${{ github.run_id }}
          restore-keys: rc-session-

      - name: Run probe
        run: python probe.py
        env:
          RC_SESSION: ${{ secrets.RC_SESSION }}
          RC_LOCAL: ${{ secrets.RC_LOCAL }}
          GAME: ${{ github.event.inputs.game }}
          HEADLESS: "1"

      - name: Save session state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session_state
          key: rc-session-${{ github.run_id }}

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe/
          if-no-files-found: ignore
