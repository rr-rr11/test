name: RollerCoin Probe2 (interactive)

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Coin-Flip,Coin-match"
        default: "Coin-Flip,Coin-match"

concurrency:
  group: rollercoin-session
  cancel-in-progress: false

jobs:
  probe2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Restore session state
        uses: actions/cache/restore@v4
        with:
          path: session_state
          key: rc-session-${{ github.run_id }}
          restore-keys: rc-session-

      - name: Run probe2
        run: python probe2.py
        env:
          RC_SESSION: ${{ secrets.RC_SESSION }}
          RC_LOCAL: ${{ secrets.RC_LOCAL }}
          GAMES: ${{ github.event.inputs.games || 'Coin-Flip,Coin-match' }}
          HEADLESS: "1"

      - name: Save session state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session_state
          key: rc-session-${{ github.run_id }}

      - name: Upload probe2 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe2
          path: probe2/
          if-no-files-found: ignore
